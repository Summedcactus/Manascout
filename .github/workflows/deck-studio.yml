name: ManaScout checks

on:
  push:
    branches: [DEVELOPMENT, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: manascout-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run dependency-free site checks
        run: python tests/run-deck-studio.py
